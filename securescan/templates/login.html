<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>Arcane Gateway — Auto Scan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Space+Mono:wght@400;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg);
      background-image: radial-gradient(circle at center, rgba(199, 125, 255, 0.1) 0%, transparent 60%);
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 40px;
      text-align: center;
    }
    .login-brand {
      font-family: var(--font-display);
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--text);
      margin-bottom: 30px;
    }
    .login-brand span {
      color: var(--accent);
    }
    .login-input {
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font-mono);
      text-align: center;
      outline: none;
      transition: var(--transition);
    }
    .login-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 15px var(--accent-glow);
    }
    .login-btn {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
    }
    .login-btn:hover {
      box-shadow: 0 0 20px var(--accent-glow);
    }
    .error-msg {
      color: var(--critical);
      font-size: 0.8rem;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div class="login-card glass">
    <div class="login-brand">AUTO<span>SCAN</span></div>
    <p style="color:var(--text-dim); margin-bottom: 24px; font-size: 0.9rem;">Enter the Arcane Gateway</p>
    {% if error %}
      <div class="error-msg">{{ error }}</div>
    {% endif %}
    <form method="POST" action="/login">
      <input type="password" name="password" class="login-input" placeholder="Master Password" required autofocus />
      <button type="submit" class="login-btn"><i class="fa-solid fa-key"></i> Authenticate</button>
    </form>
  </div>
</body>
</html>
